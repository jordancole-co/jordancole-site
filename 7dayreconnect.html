<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 7 Day Reconnect | Jordancole.co</title>
  <meta name="description" content="Sign up to start The 7 Day Reconnect for free today.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --parchment: #fdfbf7;
      --parchment-dark: #f3ede3;
      --slate: #2c2c2c;
      --slate-light: #5a5a5a;
      --amber: #c48a3a;
      --amber-hover: #a8732e;
      --amber-soft: #d9b87a;
      --warm-gray: #a39e95;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--parchment);
      color: var(--slate);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Grain texture */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 500px;
      width: 100%;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 1rem;
      animation: fadeUp 0.8s ease-out 0.1s both;
    }

    .headline {
      font-family: 'Instrument Serif', serif;
      font-size: 3rem;
      line-height: 1.12;
      font-weight: 400;
      color: var(--slate);
      margin-bottom: 0.75rem;
      animation: fadeUp 0.8s ease-out 0.2s both;
    }

    .subhead {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.25rem;
      font-weight: 300;
      color: var(--amber);
      line-height: 1.5;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.8s ease-out 0.25s both;
    }

    /* Breathing dot */
    .dot-wrapper {
      margin: 0 auto 1.75rem;
      width: 8px;
      animation: fadeUp 0.8s ease-out 0.28s both;
    }

    .breathing-dot {
      width: 8px;
      height: 8px;
      background: var(--amber);
      border-radius: 50%;
      animation: breathe 5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.8);
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive 16:9 Vimeo Wrapper */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      margin-bottom: 1.75rem;
      border-radius: 8px;
      background-color: var(--parchment-dark);
      animation: fadeUp 0.8s ease-out 0.3s both;
    }
    
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .body-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--slate-light);
      font-weight: 300;
      margin-bottom: 1.75rem;
      animation: fadeUp 0.8s ease-out 0.35s both;
    }

    /* Divider */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--amber-soft);
      margin: 0 auto 2rem;
      opacity: 0.5;
      animation: fadeUp 0.8s ease-out 0.4s both;
    }

    /* CTA + Form */
    .signup-form {
      animation: fadeUp 0.8s ease-out 0.5s both;
    }

    .form-field {
      width: 100%;
      padding: 0.95rem 1.15rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--slate);
      background: var(--parchment-dark);
      border: 1.5px solid transparent;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.25s ease, background 0.25s ease;
      margin-bottom: 0.65rem;
      text-align: left;
    }

    .form-field::placeholder {
      color: var(--warm-gray);
    }

    .form-field:focus {
      border-color: var(--amber-soft);
      background: white;
    }

    .form-btn {
      width: 100%;
      padding: 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: white;
      background: var(--amber);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.15s ease;
      margin-top: 0.25rem;
    }

    .form-btn:hover {
      background: var(--amber-hover);
      transform: translateY(-1px);
    }

    .form-btn:active {
      transform: translateY(0);
    }

    .form-note {
      font-size: 0.72rem;
      color: var(--warm-gray);
      font-weight: 300;
      line-height: 1.5;
      margin-top: 0.75rem;
    }

    .form-error {
      font-size: 0.75rem;
      color: #c44e4e;
      font-weight: 400;
      margin-top: 0.5rem;
    }

    /* Success message */
    .success-message {
      animation: fadeUp 0.5s ease-out both;
    }

    .success-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--amber);
      color: white;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .success-text {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--slate);
      font-weight: 400;
    }

    /* Footer */
    .footer-mark {
      text-align: center;
      margin-top: 3.5rem;
      animation: fadeUp 0.8s ease-out 0.6s both;
    }

    .footer-mark a {
      display: inline-block;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .footer-mark a:hover {
      opacity: 1;
    }

    .footer-mark img {
      width: 44px;
      height: auto;
    }

    .copyright {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.65rem;
      color: var(--warm-gray);
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    @media (max-width: 500px) {
      body {
        padding: 2.5rem 1.25rem 50vh;
      }

      .headline {
        font-size: 2.3rem;
      }

      .subhead {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="headline">The 7 Day Reconnect</h1>
    <p class="subhead">7 Videos in 7 Days to Reconnect to Yourself and Start Living Life with an Open Heart</p>

    <div class="dot-wrapper">
      <div class="breathing-dot"></div>
    </div>

    <div class="video-wrapper">
        <iframe src="https://player.vimeo.com/video/1215837070?color=c48a3a&title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>

    <p class="body-text">
      Sign up below to start The 7 Day Reconnect for free today.
    </p>

    <div class="divider"></div>

    <div class="signup-form" id="signupForm">
      <input
        type="text"
        class="form-field"
        id="nameField"
        placeholder="Name"
        aria-label="Name"
      />
      <input
        type="email"
        class="form-field"
        id="emailField"
        placeholder="Email address"
        aria-label="Email address"
      />
      <button type="button" class="form-btn" id="submitBtn">RECONNECT</button>
      <p class="form-note">No Spam. Unsubscribe anytime.</p>
      <p class="form-error" id="formError" style="display: none;">Please enter a valid email address.</p>
    </div>

    <div class="footer-mark">
      <a href="https://jordancole.co" aria-label="Visit jordancole.co">
        <img src="images/logo.svg" alt="JC" />
      </a>
    </div>

    <p class="copyright">Jordan Cole 2026. All Rights Reserved.</p>
  </div>

  <script>
    var emailField = document.getElementById('emailField');
    var nameField = document.getElementById('nameField');
    var formError = document.getElementById('formError');
    var submitBtn = document.getElementById('submitBtn');

    // Clear error when typing
    emailField.addEventListener('input', function() {
      formError.style.display = 'none';
      emailField.style.borderColor = 'transparent';
    });

    // Submit via Kit V3 API
    submitBtn.addEventListener('click', function() {
      var email = emailField.value.trim();
      var name = nameField.value.trim();

      // Validate email
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        formError.style.display = 'block';
        emailField.style.borderColor = '#c44e4e';
        return;
      }

      // Show sending state
      submitBtn.textContent = 'Sending...';
      submitBtn.style.opacity = '0.7';
      submitBtn.style.pointerEvents = 'none';

      // Build request body
      var body = {
        api_key: 'XKRQNbxxnep4Zy1pNrLmFQ',
        email: email
      };
      if (name) {
        body.first_name = name;
      }

      // Call Kit V3 API with the updated form ID (9768439)
      fetch('https://api.convertkit.com/v3/forms/9768439/subscribe', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json; charset=utf-8'
        },
        body: JSON.stringify(body)
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        if (data.subscription) {
          // Success — show inline confirmation
          document.getElementById('signupForm').innerHTML =
            '<div class="success-message">' +
              '<div class="success-icon">&#10003;</div>' +
              '<p class="success-text">Almost there! Check your inbox to confirm your subscription and unlock your first video.</p>' +
            '</div>';
        } else {
          // API returned an error
          formError.textContent = data.message || 'Something went wrong. Please try again.';
          formError.style.display = 'block';
          submitBtn.textContent = 'RECONNECT';
          submitBtn.style.opacity = '1';
          submitBtn.style.pointerEvents = 'auto';
        }
      })
      .catch(function() {
        formError.textContent = 'Something went wrong. Please try again.';
        formError.style.display = 'block';
        submitBtn.textContent = 'RECONNECT';
        submitBtn.style.opacity = '1';
        submitBtn.style.pointerEvents = 'auto';
      });
    });
  </script>
</body>
</html>
