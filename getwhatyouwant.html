    .dot-wrapper {

    .breathing-dot {

      height: 8px;
      background: var(--amber);
      border-radius: 50%;
      animation: breathe 5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.8); opacity: 1; }
    }

    @keyframes fadeUp {

    }
